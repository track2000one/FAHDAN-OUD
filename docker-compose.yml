services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fahdan
      POSTGRES_PASSWORD: local_dev_only_change_me
      POSTGRES_DB: fahdan
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - fahdan_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fahdan -d fahdan"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fahdan_pg:
